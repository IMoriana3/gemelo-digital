services:
  viabilidad-tcu:
    build:
      context: ../..
      dockerfile: nas/viabilidad/Dockerfile
    image: factiun-viabilidad-tcu:local
    container_name: factiun-viabilidad-tcu
    restart: unless-stopped
    init: true
    # Solo loopback por defecto, no se expone a Internet
    ports:
      - "${NAS_BIND_IP:-127.0.0.1}:${NAS_HTTP_PORT:-8787}:8787"
    environment:
      FACTIUN_MAPA_DATA: /data
      PORT: "8787"
      OPEN_METEO_API_KEY: "${OPEN_METEO_API_KEY:-}"
      FACTIUN_MAPA_TOKEN: "${FACTIUN_MAPA_TOKEN:-}"
      ENABLE_UI_QUEUE: "${ENABLE_UI_QUEUE:-0}"
      METEO_GAP_MS: "${METEO_GAP_MS:-2500}"
    volumes:
      - "${NAS_DATA_DIR:-/volume1/docker/factiun-mapa-tcu/data}:/data"
    shm_size: "512m"
    security_opt:
      - no-new-privileges:true

name: WeatherContract
on:
  pull_request:
  push:
    branches: [main]

jobs:
  weather-contract:
    name: weather-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_weather_contract.mjs
